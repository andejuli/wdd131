<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sister Anderson">
    <meta name="description" content="a form that looks like the front and back of a credit card">
    <title>Credit Card</title>
    <link href="styles.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body>
    <p class="errorMsg"></p>
    <form id="credit-card">
        <div id="cardFront">
            <p id="total">TOTAL: $199</p>
            <span class="card-image" aria-hidden="true">💳</span>
            <div id="cardNumber">
                <label for="cardNum">CARD NUMBER</label>
                <input id="cardNum" name="cardNumber" type="text" placeholder="1234 5678 9101 1020"
                required>
            </div>
            <div id="cardHolder">
                <label for='cardHold'>CARD HOLDER</label>
                <input type="text" id="cardHold" name="cardHolder" placeholder="John Doe" required>
            </div>
            <div id="cardExpiration">
                <label for="expirationDate">EXPIRATION</label>
                <input type='text' id='month' name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
                <input type='text' id='year' name="expYear" placeholder="YY" aria-labelledby="expirationDate">
            </div>
        </div>
        <div id="cardBack">
            <div id="stripe"></div>
            <div id="cardCvc">
                <label for="cvc">CVC/CVV</label>
                <input type="text" id="cvc" placeholder="xxx" required>
            </div>
        </div>
        <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
